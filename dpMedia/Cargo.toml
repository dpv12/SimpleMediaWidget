[package]
name = "dpmedia"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Media_Control"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true